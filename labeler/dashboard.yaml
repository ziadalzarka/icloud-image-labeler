title: iCloud Image Labeler
description: Processing metrics
plugins:
  datasette-dashboards:
    labeler:
      title: Labeler Dashboard
      description: Throughput, latency, and reliability metrics for the labeler
      layout:
        - [total_items, success_rate, avg_llm_duration, total_runs]
        - [avg_tokens_photo, avg_tokens_video, total_input_tokens, total_output_tokens]
        - [avg_cost_photo, avg_cost_video, total_cost_24h, total_cost_by_model]
        - [duration_over_time, duration_over_time, duration_over_time, duration_over_time]
        - [llm_duration_over_time, llm_duration_over_time, llm_duration_over_time, llm_duration_over_time]
        - [items_per_day, items_per_day, phase_breakdown, phase_breakdown]
        - [items_per_15min, items_per_15min, items_per_15min, items_per_15min]
        - [items_per_server, items_per_server, server_latency, server_latency]
        - [status_split, media_split, retries_histogram, models_by_latency]
        - [runs_timeline, runs_timeline, runs_timeline, runs_timeline]
      charts:
        total_items:
          title: Items recorded (24h)
          db: metrics
          query: |
            SELECT COUNT(*) AS value
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
        success_rate:
          title: Success rate (24h)
          db: metrics
          query: |
            SELECT ROUND(100.0 *
              SUM(CASE WHEN status = 'success' THEN 1 ELSE 0 END) /
              NULLIF(COUNT(*), 0), 1) AS value
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
            suffix: "%"
        avg_llm_duration:
          title: Avg LLM duration (24h)
          db: metrics
          query: |
            SELECT ROUND(AVG(llm_duration_s), 2) AS value
            FROM item_metrics
            WHERE llm_duration_s IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
            suffix: s
        total_runs:
          title: Batch runs (24h)
          db: metrics
          query: |
            SELECT COUNT(*) AS value
            FROM run_metrics
            WHERE started_at >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
        avg_tokens_photo:
          title: Avg tokens / photo — input vs output (24h)
          db: metrics
          query: |
            SELECT 'input' AS kind, ROUND(AVG(input_tokens), 0) AS avg_tokens
            FROM item_metrics
            WHERE media_type = 'photo'
              AND input_tokens IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
            UNION ALL
            SELECT 'output' AS kind, ROUND(AVG(output_tokens), 0) AS avg_tokens
            FROM item_metrics
            WHERE media_type = 'photo'
              AND output_tokens IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: kind, type: nominal, title: null }
              y: { field: avg_tokens, type: quantitative, title: Avg tokens }
              color:
                field: kind
                type: nominal
                scale:
                  domain: [input, output]
                  range: ["#3498db", "#e67e22"]
                legend: null
        avg_tokens_video:
          title: Avg tokens / video — input vs output (24h)
          db: metrics
          query: |
            SELECT 'input' AS kind, ROUND(AVG(input_tokens), 0) AS avg_tokens
            FROM item_metrics
            WHERE media_type = 'video'
              AND input_tokens IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
            UNION ALL
            SELECT 'output' AS kind, ROUND(AVG(output_tokens), 0) AS avg_tokens
            FROM item_metrics
            WHERE media_type = 'video'
              AND output_tokens IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: kind, type: nominal, title: null }
              y: { field: avg_tokens, type: quantitative, title: Avg tokens }
              color:
                field: kind
                type: nominal
                scale:
                  domain: [input, output]
                  range: ["#3498db", "#e67e22"]
                legend: null
        total_input_tokens:
          title: Total input tokens (24h)
          db: metrics
          query: |
            SELECT COALESCE(SUM(input_tokens), 0) AS value
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
        total_output_tokens:
          title: Total output tokens (24h)
          db: metrics
          query: |
            SELECT COALESCE(SUM(output_tokens), 0) AS value
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
        avg_cost_photo:
          title: Avg cost / photo (24h)
          db: metrics
          query: |
            SELECT ROUND(AVG(
              COALESCE(m.input_tokens, 0)  * p.input_per_1m  / 1000000.0 +
              COALESCE(m.output_tokens, 0) * p.output_per_1m / 1000000.0
            ), 6) AS value
            FROM item_metrics m
            JOIN model_pricing p ON p.model = m.model
            WHERE m.media_type = 'photo'
              AND (m.input_tokens IS NOT NULL OR m.output_tokens IS NOT NULL)
              AND m.timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
            prefix: "$"
        avg_cost_video:
          title: Avg cost / video (24h)
          db: metrics
          query: |
            SELECT ROUND(AVG(
              COALESCE(m.input_tokens, 0)  * p.input_per_1m  / 1000000.0 +
              COALESCE(m.output_tokens, 0) * p.output_per_1m / 1000000.0
            ), 6) AS value
            FROM item_metrics m
            JOIN model_pricing p ON p.model = m.model
            WHERE m.media_type = 'video'
              AND (m.input_tokens IS NOT NULL OR m.output_tokens IS NOT NULL)
              AND m.timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
            prefix: "$"
        total_cost_24h:
          title: Total cost (24h)
          db: metrics
          query: |
            SELECT ROUND(SUM(
              COALESCE(m.input_tokens, 0)  * p.input_per_1m  / 1000000.0 +
              COALESCE(m.output_tokens, 0) * p.output_per_1m / 1000000.0
            ), 4) AS value
            FROM item_metrics m
            JOIN model_pricing p ON p.model = m.model
            WHERE m.timestamp >= datetime('now', '-24 hours')
          library: metric
          display:
            field: value
            prefix: "$"
        total_cost_by_model:
          title: Total cost by model (24h)
          db: metrics
          query: |
            SELECT
              m.model AS model,
              ROUND(SUM(
                COALESCE(m.input_tokens, 0)  * p.input_per_1m  / 1000000.0
              ), 4) AS input_cost,
              ROUND(SUM(
                COALESCE(m.output_tokens, 0) * p.output_per_1m / 1000000.0
              ), 4) AS output_cost
            FROM item_metrics m
            JOIN model_pricing p ON p.model = m.model
            WHERE m.timestamp >= datetime('now', '-24 hours')
            GROUP BY m.model
          library: vega-lite
          display:
            transform:
              - fold: [input_cost, output_cost]
                as: [kind, cost]
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: cost, type: quantitative, aggregate: sum, title: "USD" }
              y: { field: model, type: nominal, sort: "-x" }
              color:
                field: kind
                type: nominal
                scale:
                  domain: [input_cost, output_cost]
                  range: ["#3498db", "#e67e22"]
        duration_over_time:
          title: Avg total duration per item (24h, hourly)
          db: metrics
          query: |
            SELECT
              strftime('%Y-%m-%dT%H:00:00Z', timestamp) AS hour,
              media_type,
              AVG(total_duration_s) AS avg_duration_s
            FROM item_metrics
            WHERE status = 'success'
              AND total_duration_s IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY hour, media_type
            ORDER BY hour
          library: vega-lite
          display:
            mark: { type: line, point: true, tooltip: true, interpolate: monotone }
            encoding:
              x: { field: hour, type: temporal, title: Hour }
              y: { field: avg_duration_s, type: quantitative, title: Avg seconds }
              color: { field: media_type, type: nominal, title: Media }
        llm_duration_over_time:
          title: Avg LLM duration by model (24h, hourly)
          db: metrics
          query: |
            SELECT
              strftime('%Y-%m-%dT%H:00:00Z', timestamp) AS hour,
              COALESCE(model, 'unknown') AS model,
              AVG(llm_duration_s) AS avg_llm_s
            FROM item_metrics
            WHERE llm_duration_s IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY hour, model
            ORDER BY hour
          library: vega-lite
          display:
            mark: { type: line, point: true, tooltip: true, interpolate: monotone }
            encoding:
              x: { field: hour, type: temporal, title: Hour }
              y: { field: avg_llm_s, type: quantitative, title: Avg seconds }
              color: { field: model, type: nominal }
        items_per_day:
          title: Items processed per hour (24h)
          db: metrics
          query: |
            SELECT
              strftime('%Y-%m-%dT%H:00:00Z', timestamp) AS hour,
              status,
              COUNT(*) AS count
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
            GROUP BY hour, status
            ORDER BY hour
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: hour, type: temporal, title: Hour }
              y: { field: count, type: quantitative, aggregate: sum, title: Items }
              color:
                field: status
                type: nominal
                scale:
                  domain: [success, failed, skipped]
                  range: ["#4c9a2a", "#c0392b", "#7f8c8d"]
        phase_breakdown:
          title: Avg phase duration (export / LLM / write, 24h)
          db: metrics
          query: |
            SELECT
              strftime('%Y-%m-%dT%H:00:00Z', timestamp) AS hour,
              ROUND(AVG(export_duration_s), 3) AS export,
              ROUND(AVG(llm_duration_s), 3) AS llm,
              ROUND(AVG(write_duration_s), 3) AS write
            FROM item_metrics
            WHERE status = 'success'
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY hour
            ORDER BY hour
          library: vega-lite
          display:
            transform:
              - fold: [export, llm, write]
                as: [phase, seconds]
            mark: { type: area, tooltip: true }
            encoding:
              x: { field: hour, type: temporal, title: Hour }
              y:
                field: seconds
                type: quantitative
                aggregate: sum
                stack: true
                title: Avg seconds
              color: { field: phase, type: nominal }
        items_per_15min:
          title: Items processed per 15-min window (24h)
          db: metrics
          query: |
            SELECT
              datetime(
                strftime('%s', timestamp) - (strftime('%s', timestamp) % 900),
                'unixepoch'
              ) AS window,
              media_type,
              COUNT(*) AS count
            FROM item_metrics
            WHERE status = 'success'
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY window, media_type
            ORDER BY window
          library: vega-lite
          display:
            mark: { type: line, point: true, tooltip: true, interpolate: monotone }
            encoding:
              x: { field: window, type: temporal, title: 15-min window }
              y: { field: count, type: quantitative, title: Items }
              color: { field: media_type, type: nominal, title: Media }
        items_per_server:
          title: Items processed per hour by server (24h)
          db: metrics
          query: |
            SELECT
              strftime('%Y-%m-%dT%H:00:00Z', timestamp) AS hour,
              COALESCE(server, 'unknown') AS server,
              COUNT(*) AS count
            FROM item_metrics
            WHERE status = 'success'
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY hour, server
            ORDER BY hour
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: hour, type: temporal, title: Hour }
              y: { field: count, type: quantitative, aggregate: sum, title: Items }
              color: { field: server, type: nominal, title: Server }
        server_latency:
          title: Avg LLM latency by server (24h)
          db: metrics
          query: |
            SELECT
              COALESCE(server, 'unknown') AS server,
              ROUND(AVG(llm_duration_s), 2) AS avg_s,
              COUNT(*) AS items
            FROM item_metrics
            WHERE llm_duration_s IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY server
            ORDER BY avg_s DESC
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: avg_s, type: quantitative, title: Avg seconds }
              y: { field: server, type: nominal, sort: "-x" }
              color: { field: server, type: nominal, legend: null }
        status_split:
          title: Status split (24h)
          db: metrics
          query: |
            SELECT status, COUNT(*) AS count
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
            GROUP BY status
          library: vega-lite
          display:
            mark: { type: arc, tooltip: true }
            encoding:
              theta: { field: count, type: quantitative }
              color: { field: status, type: nominal }
        media_split:
          title: Media type (24h)
          db: metrics
          query: |
            SELECT media_type, COUNT(*) AS count
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
            GROUP BY media_type
          library: vega-lite
          display:
            mark: { type: arc, tooltip: true }
            encoding:
              theta: { field: count, type: quantitative }
              color: { field: media_type, type: nominal }
        retries_histogram:
          title: LLM retries (24h)
          db: metrics
          query: |
            SELECT llm_retries, COUNT(*) AS count
            FROM item_metrics
            WHERE timestamp >= datetime('now', '-24 hours')
            GROUP BY llm_retries
            ORDER BY llm_retries
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: llm_retries, type: ordinal, title: Retries }
              y: { field: count, type: quantitative }
        models_by_latency:
          title: Avg LLM latency by model (24h)
          db: metrics
          query: |
            SELECT
              COALESCE(model, 'unknown') AS model,
              ROUND(AVG(llm_duration_s), 2) AS avg_s,
              COUNT(*) AS items
            FROM item_metrics
            WHERE llm_duration_s IS NOT NULL
              AND timestamp >= datetime('now', '-24 hours')
            GROUP BY model
            ORDER BY avg_s DESC
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: avg_s, type: quantitative, title: Avg seconds }
              y: { field: model, type: nominal, sort: "-x" }
        runs_timeline:
          title: Batch runs — items processed and duration (24h)
          db: metrics
          query: |
            SELECT
              started_at,
              (photos_processed + videos_processed) AS items,
              total_duration_s,
              CASE WHEN (photos_failed + videos_failed) > 0 THEN 'with failures' ELSE 'clean' END AS outcome
            FROM run_metrics
            WHERE finished_at IS NOT NULL
              AND started_at >= datetime('now', '-24 hours')
            ORDER BY started_at
          library: vega-lite
          display:
            mark: { type: bar, tooltip: true }
            encoding:
              x: { field: started_at, type: temporal, title: Run start }
              y: { field: items, type: quantitative, title: Items processed }
              color: { field: outcome, type: nominal }
